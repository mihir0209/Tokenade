<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokenade Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a; color: #e0e0e0; min-height: 100vh;
    }
    .header {
      background: #111; border-bottom: 1px solid #222; padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .header h1 { font-size: 1.3em; color: #00ff88; }
    .header .status { font-size: 0.85em; display: flex; align-items: center; gap: 8px; }
    .header .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff6b6b; }
    .header .dot.connected { background: #00ff88; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card {
      background: #111; border: 1px solid #222; border-radius: 8px; padding: 16px;
    }
    .card h3 { font-size: 0.85em; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .card .value { font-size: 1.8em; font-weight: 600; color: #fff; }
    .card .value.green { color: #00ff88; }
    .card .value.red { color: #ff6b6b; }
    .card .value.yellow { color: #ffaa00; }
    .card .sub { font-size: 0.8em; color: #666; margin-top: 4px; }
    .sessions-table {
      width: 100%; border-collapse: collapse; background: #111;
      border: 1px solid #222; border-radius: 8px; overflow: hidden;
    }
    .sessions-table th {
      text-align: left; padding: 12px 16px; background: #1a1a1a;
      font-size: 0.8em; color: #888; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .sessions-table td { padding: 12px 16px; border-top: 1px solid #222; font-size: 0.9em; }
    .sessions-table tr:hover { background: #1a1a1a; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-size: 0.75em; font-weight: 500;
    }
    .badge-green { background: #00ff8822; color: #00ff88; }
    .badge-red { background: #ff6b6b22; color: #ff6b6b; }
    .badge-yellow { background: #ffaa0022; color: #ffaa00; }
    .badge-gray { background: #333; color: #888; }
    .btn {
      padding: 8px 16px; border-radius: 6px; border: none;
      font-size: 0.85em; font-weight: 500; cursor: pointer; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #00ff88; color: #000; }
    .btn-secondary { background: #333; color: #fff; }
    .btn-danger { background: #ff6b6b; color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: 0.8em; }
    .section-title { font-size: 1.1em; margin-bottom: 16px; color: #fff; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .health-bar { height: 8px; background: #222; border-radius: 4px; overflow: hidden; margin-top: 8px; }
    .health-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
    .health-fill.green { background: #00ff88; }
    .health-fill.yellow { background: #ffaa00; }
    .health-fill.red { background: #ff6b6b; }
    .detail-panel {
      background: #111; border: 1px solid #222; border-radius: 8px;
      padding: 20px; margin-top: 16px; display: none;
    }
    .detail-panel.visible { display: block; }
    .cookie-list { max-height: 300px; overflow-y: auto; }
    .cookie-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid #1a1a1a; font-size: 0.85em;
    }
    .cookie-name { font-family: monospace; color: #00ff88; }
    .cookie-domain { color: #888; }
    .empty-state { text-align: center; padding: 40px; color: #555; }
    .refresh-indicator { font-size: 0.8em; color: #555; }
    #loading { text-align: center; padding: 40px; color: #888; }
    .error-msg { background: #ff6b6b22; color: #ff6b6b; padding: 12px; border-radius: 6px; margin: 16px 0; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Tokenade Dashboard</h1>
    <div class="status">
      <span class="dot" id="api-dot"></span>
      <span id="api-status">Connecting...</span>
      <span class="refresh-indicator" id="last-refresh"></span>
    </div>
  </div>

  <div class="container">
    <div id="loading">Loading dashboard...</div>
    <div id="error" class="error-msg" style="display: none;"></div>
    <div id="dashboard" style="display: none;">
      <div class="grid">
        <div class="card">
          <h3>Total Sessions</h3>
          <div class="value" id="total-sessions">0</div>
        </div>
        <div class="card">
          <h3>Total Cookies</h3>
          <div class="value" id="total-cookies">0</div>
        </div>
        <div class="card">
          <h3>Healthy</h3>
          <div class="value green" id="healthy-sessions">0</div>
        </div>
        <div class="card">
          <h3>Expiring Soon</h3>
          <div class="value yellow" id="expiring-sessions">0</div>
        </div>
        <div class="card">
          <h3>Expired</h3>
          <div class="value red" id="expired-sessions">0</div>
        </div>
        <div class="card">
          <h3>Server Version</h3>
          <div class="value" id="server-version">-</div>
          <div class="sub" id="sessions-dir"></div>
        </div>
      </div>

      <div class="section-header">
        <div class="section-title">Sessions</div>
        <button class="btn btn-secondary btn-sm" onclick="refreshAll()">Refresh</button>
      </div>
      <table class="sessions-table">
        <thead>
          <tr>
            <th>Site</th>
            <th>Cookies</th>
            <th>Health</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="sessions-tbody"></tbody>
      </table>

      <div id="detail-panel" class="detail-panel">
        <div class="section-header">
          <div class="section-title" id="detail-title">Session Details</div>
          <button class="btn btn-secondary btn-sm" onclick="closeDetail()">Close</button>
        </div>
        <div id="detail-content"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let refreshInterval;

    async function apiFetch(path) {
      const response = await fetch(`${API_BASE}${path}`);
      if (!response.ok) throw new Error(`API returned ${response.status}`);
      return response.json();
    }

    function showError(msg) {
      document.getElementById('error').textContent = msg;
      document.getElementById('error').style.display = 'block';
    }

    function hideError() {
      document.getElementById('error').style.display = 'none';
    }

    function updateHealthBar(container, healthy, warning, expired) {
      const total = healthy + warning + expired || 1;
      return `
        <div class="health-bar">
          <div class="health-fill green" style="width: ${(healthy/total)*100}%"></div>
        </div>
        <div style="font-size: 0.75em; color: #666; margin-top: 4px;">
          <span class="badge badge-green">${healthy} healthy</span>
          <span class="badge badge-yellow">${warning} warning</span>
          <span class="badge badge-red">${expired} expired</span>
        </div>
      `;
    }

    function timeAgo(isoStr) {
      if (!isoStr) return '-';
      const diff = Date.now() - new Date(isoStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours/24)}d ago`;
    }

    async function loadHealth() {
      try {
        const health = await apiFetch('/api/health');
        document.getElementById('api-dot').classList.add('connected');
        document.getElementById('api-status').textContent = 'Connected';
        document.getElementById('server-version').textContent = health.version;
        document.getElementById('sessions-dir').textContent = health.sessions_dir;
        return true;
      } catch (e) {
        document.getElementById('api-dot').classList.remove('connected');
        document.getElementById('api-status').textContent = 'Disconnected';
        return false;
      }
    }

    async function loadSessions() {
      try {
        const data = await apiFetch('/api/sessions');
        const sessions = data.sessions || [];
        document.getElementById('total-sessions').textContent = sessions.length;

        let totalCookies = 0;
        const tbody = document.getElementById('sessions-tbody');
        tbody.innerHTML = sessions.map(s => {
          totalCookies += s.cookie_count;
          return `
            <tr>
              <td><strong>${s.site_name}</strong><br><span style="color:#666;font-size:0.8em">${s.source_browser}</span></td>
              <td>${s.cookie_count}</td>
              <td><span class="badge badge-gray">Check health</span></td>
              <td>${timeAgo(s.created_at)}</td>
              <td>
                <button class="btn btn-secondary btn-sm" onclick="viewSession('${s.path}')">Details</button>
                <button class="btn btn-danger btn-sm" onclick="deleteSession('${s.path}')">Delete</button>
              </td>
            </tr>
          `;
        }).join('');

        if (sessions.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No sessions found. Run <code>tokenade export</code> to create one.</td></tr>';
        }

        document.getElementById('total-cookies').textContent = totalCookies;
      } catch (e) {
        showError(`Failed to load sessions: ${e.message}`);
      }
    }

    async function loadMonitor() {
      try {
        const status = await apiFetch('/api/monitor/status');
        if (!status.monitoring) return;

        const sessions = status.sessions || [];
        let healthy = 0, expiring = 0, expired = 0;
        sessions.forEach(s => {
          if (s.health_score >= 70) healthy++;
          else if (s.health_score >= 40) expiring++;
          else expired++;
        });

        document.getElementById('healthy-sessions').textContent = healthy;
        document.getElementById('expiring-sessions').textContent = expiring;
        document.getElementById('expired-sessions').textContent = expired;
      } catch (e) {
        // Monitor not available, show dashes
        document.getElementById('healthy-sessions').textContent = '-';
        document.getElementById('expiring-sessions').textContent = '-';
        document.getElementById('expired-sessions').textContent = '-';
      }
    }

    async function viewSession(path) {
      try {
        const sessionId = path.split('/').pop().replace('.tokenade', '').replace('.json', '');
        let html = '';

        // Try to get monitoring data
        try {
          const monitor = await apiFetch(`/api/monitor/sessions/${sessionId}`);
          html += `<h4 style="margin-bottom:12px;color:#00ff88">Health: ${monitor.health_score}%</h4>`;
          html += updateHealthBar(null, monitor.healthy_cookies, monitor.warning_cookies, monitor.expired_cookies);

          if (monitor.cookies && monitor.cookies.length > 0) {
            html += `<h4 style="margin:16px 0 8px;color:#888">Cookies (${monitor.cookies.length})</h4>`;
            html += '<div class="cookie-list">';
            monitor.cookies.forEach(c => {
              const badgeClass = c.health === 'healthy' ? 'badge-green' : c.health === 'warning' ? 'badge-yellow' : 'badge-red';
              const remaining = c.remaining_seconds > 0 ? `${Math.floor(c.remaining_seconds/3600)}h left` : 'expired';
              html += `
                <div class="cookie-item">
                  <span><span class="cookie-name">${c.name}</span> <span class="cookie-domain">${c.domain}</span></span>
                  <span><span class="badge ${badgeClass}">${c.health}</span> ${remaining}</span>
                </div>`;
            });
            html += '</div>';
          }

          if (monitor.issues && monitor.issues.length > 0) {
            html += '<h4 style="margin:16px 0 8px;color:#ff6b6b">Issues</h4>';
            monitor.issues.forEach(i => { html += `<div style="font-size:0.85em;color:#ff6b6b">- ${i}</div>`; });
          }
        } catch (e) {
          html = '<p style="color:#888">Session monitoring data not available. Start the proxy to enable monitoring.</p>';
        }

        document.getElementById('detail-title').textContent = `Session: ${sessionId}`;
        document.getElementById('detail-content').innerHTML = html;
        document.getElementById('detail-panel').classList.add('visible');
      } catch (e) {
        showError(`Failed to load session: ${e.message}`);
      }
    }

    function closeDetail() {
      document.getElementById('detail-panel').classList.remove('visible');
    }

    async function deleteSession(path) {
      if (!confirm('Delete this session?')) return;
      try {
        const sessionId = path.split('/').pop().replace('.tokenade', '').replace('.json', '');
        await fetch(`${API_BASE}/api/sessions/${sessionId}`, { method: 'DELETE' });
        await loadSessions();
      } catch (e) {
        showError(`Failed to delete: ${e.message}`);
      }
    }

    async function refreshAll() {
      hideError();
      document.getElementById('last-refresh').textContent = 'Refreshing...';
      await loadHealth();
      await loadSessions();
      await loadMonitor();
      document.getElementById('last-refresh').textContent = `Updated ${new Date().toLocaleTimeString()}`;
    }

    async function init() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
      hideError();

      const connected = await loadHealth();
      if (!connected) {
        document.getElementById('loading').innerHTML =
          '<p>Cannot connect to Tokenade API server.</p>' +
          '<p style="margin-top:8px">Start it with: <code>tokenade api-server</code></p>';
        return;
      }

      document.getElementById('loading').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      await refreshAll();

      // Auto-refresh every 30 seconds
      refreshInterval = setInterval(refreshAll, 30000);
    }

    init();
  </script>
</body>
</html>
