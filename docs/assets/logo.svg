<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Tokenade">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="token" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- outer portability ring -->
  <circle cx="128" cy="128" r="86" fill="none" stroke="url(#accent)" stroke-width="10" opacity="0.9"/>
  <circle cx="128" cy="128" r="86" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="18 14" opacity="0.55"/>
  <!-- session token chip -->
  <rect x="78" y="98" width="100" height="60" rx="14" fill="url(#token)" opacity="0.95"/>
  <rect x="90" y="114" width="36" height="10" rx="5" fill="#0f172a" opacity="0.85"/>
  <rect x="90" y="132" width="56" height="8" rx="4" fill="#0f172a" opacity="0.45"/>
  <!-- transfer arrows -->
  <path d="M48 128h22" stroke="#22d3ee" stroke-width="8" stroke-linecap="round"/>
  <path d="M62 116l14 12-14 12" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M186 128h22" stroke="#818cf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M194 116l14 12-14 12" fill="none" stroke="#818cf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- lock notch -->
  <circle cx="156" cy="128" r="9" fill="#0f172a" opacity="0.75"/>
  <rect x="151" y="128" width="10" height="12" rx="2" fill="#0f172a" opacity="0.75"/>
</svg>
