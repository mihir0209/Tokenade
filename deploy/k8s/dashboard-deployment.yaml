apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokenade-dashboard
  namespace: tokenade
  labels:
    app.kubernetes.io/name: tokenade
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tokenade
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tokenade
        app.kubernetes.io/component: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: tokenade-dashboard
          image: tokenade:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              from tokenade.core.dashboard.server_enhanced import DashboardServer, DashboardConfig
              import os
              config = DashboardConfig(
                  host="0.0.0.0",
                  port=8080,
                  title="Tokenade Session Monitor",
                  refresh_interval=10,
                  require_auth=True,
                  username=os.environ.get("DASHBOARD_USERNAME", "admin"),
                  password=os.environ.get("DASHBOARD_PASSWORD", "changeme"),
              )
              server = DashboardServer(config)
              server.start(block=True)
          ports:
            - containerPort: 8080
              name: dashboard
              protocol: TCP
          env:
            - name: DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tokenade-secrets
                  key: DASHBOARD_PASSWORD
            - name: TOKENADE_SESSIONS_DIR
              value: /data/sessions
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tokenade-data-pvc
