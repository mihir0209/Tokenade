apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokenade
  namespace: tokenade
  labels:
    app.kubernetes.io/name: tokenade
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tokenade
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tokenade
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: tokenade-api
          image: tokenade:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "tokenade", "serve", "--host", "0.0.0.0", "--port", "9224"]
          ports:
            - containerPort: 9224
              name: api
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tokenade-config
          env:
            - name: VAULT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: tokenade-secrets
                  key: VAULT_ENCRYPTION_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /home/tokenade/.tokenade/config.yaml
              subPath: config.yaml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 9224
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 9224
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tokenade-data-pvc
        - name: config
          configMap:
            name: tokenade-config-files
