apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tokenade-ingress
  namespace: tokenade
  labels:
    app.kubernetes.io/name: tokenade
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tokenade-api.example.com
        - tokenade-dashboard.example.com
      secretName: tokenade-tls
  rules:
    - host: tokenade-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tokenade-api
                port:
                  number: 9224
    - host: tokenade-dashboard.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tokenade-dashboard
                port:
                  number: 8080
