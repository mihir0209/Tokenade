version: '3.8'

services:
  tokenade:
    build: .
    container_name: tokenade
    volumes:
      - tokenade-sessions:/home/tokenade/.tokenade/sessions
      - tokenade-plugins:/home/tokenade/.tokenade/plugins
      - tokenade-config:/home/tokenade/.tokenade
    environment:
      - TOKENADE_HOME=/home/tokenade/.tokenade
    networks:
      - tokenade-net
    restart: unless-stopped

  # Optional: Gateway service for session routing
  gateway:
    build: .
    container_name: tokenade-gateway
    command: ["gateway", "--request", "/home/tokenade/.tokenade/gateway.request.json"]
    volumes:
      - tokenade-sessions:/home/tokenade/.tokenade/sessions
      - tokenade-plugins:/home/tokenade/.tokenade/plugins
      - tokenade-config:/home/tokenade/.tokenade
    ports:
      - "9222:9222"
    environment:
      - TOKENADE_HOME=/home/tokenade/.tokenade
    networks:
      - tokenade-net
    depends_on:
      - tokenade
    restart: unless-stopped

  # Optional: API server for session management
  api:
    build: .
    container_name: tokenade-api
    command: ["serve", "--host", "0.0.0.0", "--port", "9224"]
    volumes:
      - tokenade-sessions:/home/tokenade/.tokenade/sessions
      - tokenade-plugins:/home/tokenade/.tokenade/plugins
      - tokenade-config:/home/tokenade/.tokenade
    ports:
      - "9224:9224"
    environment:
      - TOKENADE_HOME=/home/tokenade/.tokenade
    networks:
      - tokenade-net
    depends_on:
      - tokenade
    restart: unless-stopped

volumes:
  tokenade-sessions:
  tokenade-plugins:
  tokenade-config:

networks:
  tokenade-net:
    driver: bridge
