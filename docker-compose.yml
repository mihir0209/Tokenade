version: "3.8"

services:
  # Default service - interactive shell
  tokenade:
    build: .
    image: tokenade:latest
    container_name: tokenade
    volumes:
      - tokenade-sessions:/app/sessions
      - tokenade-browser:/app/browser_data
      - tokenade-fingerprints:/app/.fingerprints
      - tokenade-reports:/app/reports
    environment:
      - TOKENADE_DATA_DIR=/app
      - PYTHONUNBUFFERED=1
    # For headless browser support
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    stdin_open: true
    tty: true
    restart: "no"
    command: bash

  # Proxy service
  tokenade-proxy:
    build: .
    image: tokenade:latest
    container_name: tokenade-proxy
    ports:
      - "9222:9222"
    volumes:
      - tokenade-sessions:/app/sessions
      - tokenade-browser:/app/browser_data
    environment:
      - TOKENADE_DATA_DIR=/app
      - PYTHONUNBUFFERED=1
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import tokenade; print(tokenade.__version__)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    command: ["proxy", "--all", "--port", "9222"]

  # API server service
  tokenade-api:
    build: .
    image: tokenade:latest
    container_name: tokenade-api
    ports:
      - "9224:9224"
    volumes:
      - tokenade-sessions:/app/sessions
    environment:
      - TOKENADE_DATA_DIR=/app
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import tokenade; print(tokenade.__version__)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    command: ["python", "-c", "from tokenade.core.api.server import TokenadeAPIServer; import asyncio; s=TokenadeAPIServer(); asyncio.run(s.start())"]

  # Development service with live code mounting
  tokenade-dev:
    build: .
    image: tokenade:dev
    container_name: tokenade-dev
    volumes:
      - ./tokenade:/app/tokenade
      - tokenade-sessions:/app/sessions
      - tokenade-browser:/app/browser_data
    environment:
      - TOKENADE_DATA_DIR=/app
      - PYTHONUNBUFFERED=1
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    stdin_open: true
    tty: true
    restart: "no"
    command: bash

volumes:
  tokenade-sessions:
  tokenade-browser:
  tokenade-fingerprints:
  tokenade-reports:
