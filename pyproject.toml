[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenade"
version = "1.3.0"
description = "Portable browser sessions: export cookies & storage to .tokenade, then launch, proxy, or share on another machine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "MiHiR"}]
keywords = [
    "browser",
    "cookies",
    "session",
    "portability",
    "tokenade",
    "playwright",
    "fingerprint",
    "tls",
    "proxy",
    "oauth",
    "chrome",
    "firefox",
    "localstorage",
    "session-export",
    "cli",
    "tui",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "playwright>=1.40.0",
    "cloakbrowser>=0.4.0",
    "curl-cffi>=0.6.0",
    "requests>=2.28.0",
    "pycryptodome>=3.19.0",
    "cryptography>=41.0.0",
    "keyring>=24.0.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "PyYAML>=6.0",
    "packaging>=21.0",
    "paramiko>=3.4.0",
    "plyvel>=1.5.0; sys_platform == 'linux'",
    # Platform cookie-crypto backends (installed automatically by pip/uv)
    "pywin32>=306; sys_platform == 'win32'",
    "secretstorage>=3.3.3; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Kept for older docs/scripts: pip install 'tokenade[windows]' / 'tokenade[linux]'
# Core install already pulls these via environment markers above.
windows = ["pywin32>=306; sys_platform == 'win32'"]
linux = ["secretstorage>=3.3.3; sys_platform == 'linux'"]
# runtime kept as alias for older docs/install scripts; curl-cffi is now a core dep
runtime = ["curl-cffi>=0.6.0"]
ldap = ["ldap3>=2.9"]
enterprise = ["ldap3>=2.9"]
tui = ["textual>=0.40.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-aiohttp>=1.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
    "pytest-xdist>=3.0.0",
    "hypothesis>=6.0.0",
    # mutmut 3.x expects top-level tests/; we use tokenade/tests/ — pin 2.x
    "mutmut>=2.4.0,<3",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
]

[project.scripts]
tokenade = "tokenade.cli:main"

[project.urls]
Homepage = "https://codeberg.org/mihir0209/tokenade"
Documentation = "https://codeberg.org/mihir0209/tokenade/src/branch/main/README.md"
Repository = "https://codeberg.org/mihir0209/tokenade"
Issues = "https://codeberg.org/mihir0209/tokenade/issues"

[tool.setuptools.packages.find]
include = ["tokenade*"]
exclude = ["tokenade.tests", "tokenade.tests.*"]

[tool.pytest.ini_options]
testpaths = ["tokenade/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --tb=short --timeout=60"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests requiring network access",
    "asyncio: marks tests as asyncio",
]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.flake8]
max-line-length = 120
ignore = ["E501", "W503", "E203"]
exclude = [".git", "__pycache__", "build", "dist", "*.egg-info"]

# Mutation testing (prefer over pure line-coverage theater).
# Run: make test-mut
# See .agent/reviews/2026-07-09-coverage-test-uniqueness-analysis.md
# Pin mutmut 2.x — 3.x copies into mutants/ and expects top-level tests/.
[tool.mutmut]
# High-value slice (site_configs is mostly static tables — optional second pass).
paths_to_mutate = "tokenade/handlers/resolve.py,tokenade/core/errors.py,tokenade/core/crypto/encryptor.py"
backup = false
runner = "python -m pytest tokenade/tests/test_handler_resolve.py tokenade/tests/test_encryptor.py tokenade/tests/test_encryptor_edge.py tokenade/tests/test_errors.py tokenade/tests/test_mutmut_killers.py -q --tb=line -o addopts= -m 'not network'"
tests_dir = "tokenade/tests/"
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
