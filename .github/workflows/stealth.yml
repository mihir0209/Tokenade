name: Stealth Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stealth-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run stealth validation tests
      run: |
        python -m pytest tokenade/tests/test_stealth_validation.py -v --tb=short

    - name: Run fingerprint consistency tests
      run: |
        python -m pytest tokenade/tests/test_fingerprint_consistency.py -v --tb=short

    - name: Upload stealth reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stealth-reports
        path: |
          ~/.tokenade/stealth_report.html
          ~/.tokenade/stealth_report.json
        retention-days: 30
