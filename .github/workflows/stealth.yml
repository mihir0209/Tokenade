name: Stealth Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stealth-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install playwright
        playwright install chromium

    - name: Run stealth validation tests
      run: |
        python -m pytest tokenade/tests/test_stealth_validation.py -v --tb=short

    - name: Run fingerprint consistency tests
      run: |
        python -m pytest tokenade/tests/test_fingerprint_consistency.py -v --tb=short

    - name: Run full test suite
      run: |
        python -m pytest tokenade/tests/ --tb=short -q --ignore=tokenade/tests/test_tls_matcher.py

    - name: Upload stealth reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stealth-reports-${{ matrix.python-version }}
        path: |
          ~/.tokenade/stealth_report.html
          ~/.tokenade/stealth_report.json
        retention-days: 30
