<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #00d4ff;
    }
    .header .version {
      font-size: 11px;
      color: #666;
      margin-left: auto;
    }
    .site-info {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .site-info .domain {
      font-size: 14px;
      font-weight: 600;
      color: #00d4ff;
      word-break: break-all;
    }
    .site-info .cookie-count {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat {
      background: #16213e;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }
    .stat .value {
      font-size: 20px;
      font-weight: 700;
      color: #00d4ff;
    }
    .stat .label {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
    }
    .stat.warn .value { color: #ffd700; }
    .stat.error .value { color: #ff4444; }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      color: #000;
    }
    .btn-secondary {
      background: #2a2a4a;
      color: #e0e0e0;
      border: 1px solid #444;
    }
    .btn-danger {
      background: #4a1a1a;
      color: #ff6666;
      border: 1px solid #662222;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .status.success { display: block; background: #1a3a1a; color: #66ff66; }
    .status.error { display: block; background: #3a1a1a; color: #ff6666; }
    .status.loading { display: block; background: #1a1a3a; color: #66aaff; }
    .options {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }
    .options label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #888;
      cursor: pointer;
    }
    .options input[type="checkbox"] {
      accent-color: #00d4ff;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size:24px">🔐</span>
    <h1>Tokenade</h1>
    <span class="version">v1.0</span>
  </div>

  <div class="site-info">
    <div class="domain" id="domain">Loading...</div>
    <div class="cookie-count" id="cookie-count">Scanning cookies...</div>
  </div>

  <div class="stats">
    <div class="stat" id="stat-total">
      <div class="value" id="total-value">-</div>
      <div class="label">Total</div>
    </div>
    <div class="stat" id="stat-expired">
      <div class="value" id="expired-value">-</div>
      <div class="label">Expired</div>
    </div>
    <div class="stat" id="stat-health">
      <div class="value" id="health-value">-</div>
      <div class="label">Health</div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn btn-primary" id="btn-download" disabled>
      📥 Download .tokenade
    </button>
    <button class="btn btn-secondary" id="btn-clipboard" disabled>
      📋 Copy to Clipboard
    </button>
  </div>

  <div class="options">
    <label>
      <input type="checkbox" id="opt-all-domains">
      Export all domains (not just current site)
    </label>
  </div>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
